<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Welcome</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            text-align: center;
        }
        .avatar {
            border-radius: 50%;
            margin: 20px;
        }
        .user-info {
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>Welcome, <span th:text="${name}">Username</span>!</h1>

    <div class="user-info">
        <!-- Show Discord avatar if available -->
        <img th:if="${avatar != null}" 
             th:src="@{'https://cdn.discordapp.com/avatars/' + ${id} + '/' + ${avatar} + '.png'}"
             alt="User Avatar" 
             width="128" 
             height="128"
             class="avatar"/>
        
        <!-- Show default avatar if no Discord avatar -->
        <img th:if="${avatar == null}" 
             src="/images/default-avatar.png"
             alt="Default Avatar" 
             width="128" 
             height="128"
             class="avatar"/>

        <p>Discord ID: <span th:text="${id}">N/A</span></p>
        <p th:if="${email != null}">Email: <span th:text="${email}">N/A</span></p>
    </div>

    <p><a th:href="@{/logout}">Logout</a></p>
</body>
</html>
